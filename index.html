<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harri</title>
    <meta
      name="description"
      content="I'm Harri. Software engineer at CommandOSS. I bake a lot of bread and write it all down."
    />
    <meta property="og:title" content="Harri" />
    <meta
      property="og:description"
      content="By day I'm a software engineer at CommandOSS. I bake a lot of bread and write it all down."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harrymove-ctrl.github.io/" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('harri-theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
